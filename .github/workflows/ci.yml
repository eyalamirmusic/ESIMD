name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # A universal build has no AVX2 translation unit: the x86_64 slice
          # runs on the SSE2 baseline. The two single-arch lanes below cover the
          # AVX2 path, and the arm64 lanes NEON.
          - name: macOS Universal
            os: macos-latest
            cache-key: macos-universal
            cmake-flags: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"'
          - name: macOS arm64
            os: macos-latest
            cache-key: macos-arm64
            cmake-flags: ''
          - name: Linux GCC
            os: ubuntu-latest
            cache-key: linux-gcc
            cmake-flags: '-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++'
          - name: Linux Clang
            os: ubuntu-latest
            cache-key: linux-clang
            cmake-flags: '-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++'
          - name: Windows MSVC
            os: windows-latest
            cache-key: windows-msvc-x64
            msvc-arch: x64
            cmake-flags: ''
          - name: Windows Clang
            os: windows-latest
            cache-key: windows-clang-x64
            msvc-arch: x64
            cmake-flags: '-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl'
          - name: Windows MSVC ARM64
            os: windows-11-arm
            cache-key: windows-msvc-arm64
            msvc-arch: arm64
            cmake-flags: ''
          - name: Windows Clang ARM64
            os: windows-11-arm
            cache-key: windows-clang-arm64
            msvc-arch: arm64
            cmake-flags: '-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl'

    runs-on: ${{ matrix.os }}

    # CCACHE_DEPEND: ccache hashes the source and the include files the
    # compiler's own dependency output names (-MD, /showIncludes) instead of
    # running the preprocessor a second time, so a miss costs the compile and
    # nothing more. What it gives up - a hit after a change the preprocessor
    # would have erased - never happens on a runner.
    env:
      CCACHE_DEPEND: '1'

    steps:
      - uses: actions/checkout@v6

      # A ccache per compiler and architecture, kept in the Actions cache. The
      # eviction keeps each saved cache to what this build touched. The Windows
      # x64 image carries Strawberry Perl's ccache 4.9.1 on PATH, which the
      # default detection would take; the binary install is ccache's own
      # current release on every Windows lane instead.
      - name: Set up the compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ matrix.cache-key }}
          max-size: 500M
          evict-old-files: job
          install: ${{ runner.os == 'Windows' && 'binary' || 'detect' }}

      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: egor-tensin/vs-shell@54e4148eac794e4580591c2e0b7750f14b7891fc # v2
        with:
          arch: ${{ matrix.msvc-arch }}

      # Debug on purpose: the library forces its own optimization level in every
      # configuration, and this is the configuration where that has to hold.
      # Windows embeds debug info in each object (/Z7): the default /Zi writes
      # one PDB per target that every translation unit appends to, which no
      # per-object cache can restore.
      - name: Configure
        run: >
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug -DESIMD_UNITY_BUILD=ON
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ${{ runner.os == 'Windows' && '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded' || '' }}
          ${{ matrix.cmake-flags }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4

  # Build only: the tests are compiled for the simulator and nothing runs them.
  build-ios:
    name: iOS Simulator
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake -G Xcode -B build
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphonesimulator
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DESIMD_UNITY_BUILD=ON

      - name: Build
        run: cmake --build build --config Debug -- -sdk iphonesimulator

  # Build only, as for iOS. The runner's SDK names an older NDK in
  # ANDROID_NDK_HOME, so the toolchain file is taken from the one installed
  # here. API 33 is eacp's minSdk.
  build-android:
    name: Android arm64-v8a
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 30.0.16248370

    steps:
      - uses: actions/checkout@v6

      - name: Install Ninja and the NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"

      # No target uses C++20 modules; the scan pass is dead weight.
      - name: Configure
        run: >
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug -DESIMD_UNITY_BUILD=ON
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-33
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF

      - name: Build
        run: cmake --build build
